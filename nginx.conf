server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /entreprise/ {
        proxy_pass http://localhost:8080/entreprise/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /equipe/ {
        proxy_pass http://localhost:8080/equipe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /projet/ {
        proxy_pass http://localhost:8080/projet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /projet-detaille/ {
        proxy_pass http://localhost:8080/projet-detaille/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
