# Unique identifier for your project
sonar.projectKey=hasdryball_devops-app
sonar.projectName=DevOps-AppGestionDesProjets
sonar.projectVersion=1.0

# Comma-separated paths to directories containing source files
sonar.sources=backend/src/main/java,frontend/src

# Path to compiled Java classes (for better analysis)
sonar.java.binaries=backend/target/classes

# Exclude test files and generated code if needed
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/target/**,**/dist/**

# Encoding
sonar.sourceEncoding=UTF-8
